name: Build Pro Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Give permission to Gradle wrapper
      run: chmod +x ./gradlew || echo "No gradlew found"

    - name: Install JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Build with Gradle (Auto Detect)
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "⚠️ gradlew missing, trying with system gradle"
          gradle assembleDebug || echo "Gradle failed"
        fi

    - name: Find APK file
      run: |
        APK_PATH=$(find . -name "*.apk" | head -n 1)
        echo "APK found at: $APK_PATH"
        echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: ProLauncher-debug.apk
        path: ${{ env.APK_PATH }}
        
